name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate website links and scripts
        run: |
          python3 scripts/check_site.py
          node --check site/app.js

      - name: Refresh download fallback from the latest real release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api repos/${{ github.repository }}/releases/latest
          --jq '{tag_name,name,body,published_at,html_url,draft,prerelease,assets: [.assets[] | {name,size,browser_download_url}]}'
          > site/release.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
