name: Report inappropriate AI content
description: Report a harmful, inappropriate or misleading Capri reply.
title: "[AI content] "
body:
  - type: markdown
    attributes:
      value: "Reports are public. Do not include API keys, private page contents or personal information. Review and redact excerpts before submitting."
  - type: input
    id: version
    attributes:
      label: App version and selected model/provider
  - type: textarea
    id: concern
    attributes:
      label: What went wrong?
      description: Include only a non-sensitive excerpt and enough context to investigate.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened instead?
